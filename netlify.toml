# Netlify config — hosts the till (static) + the catalog proxy (function) on one site.
# The secret Squarespace key lives in an env var (SQUARESPACE_API_KEY), never in the browser.

[build]
  # Only the till itself is published. Publishing "." used to put the whole repo
  # on the web — the Google Sheet script, the cost-price spreadsheets, README…
  command = "mkdir -p site && cp index.html sw.js site/"
  publish = "site"
  functions = "netlify/functions"
  # Each production deploy costs plan credits, so skip the build when nothing the
  # site uses changed (e.g. a Google Sheet script or README-only edit).
  # Exit 0 = skip, exit 1 = build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- index.html sw.js netlify netlify.toml package.json"

# Pretty URL: the app calls /api/catalog, Netlify routes it to the function.
[[redirects]]
  from = "/api/catalog"
  to = "/.netlify/functions/catalog"
  status = 200

# The offline worker must always be re-checked, or a new version of the till
# could wait days to reach a device.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
